spring:
  application:
    name: release-sentinel-api
  datasource:
    url: jdbc:postgresql://localhost:5432/release_sentinel
    username: release_sentinel
    password: release_sentinel
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

release-sentinel:
  cors:
    allowed-origins: ${RELEASE_SENTINEL_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
