server:
  address: 0.0.0.0
  port: ${PORT:10000}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/release_sentinel}
    username: ${SPRING_DATASOURCE_USERNAME:release_sentinel}
    password: ${SPRING_DATASOURCE_PASSWORD:release_sentinel}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

release-sentinel:
  cors:
    allowed-origins: ${RELEASE_SENTINEL_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
